<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Equipes de trabalho da Obra 369: vincular colaboradores a encarregados e exportar para o Excel.">
  <title>Equipes | Obra 369</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="site-overrides.css?v=20260929-loading">
  <link rel="stylesheet" href="Equipes.css">
  <link rel="icon" type="image/svg+xml" href="images/issel-informatica-simbolo.svg">
</head>
<body class="teams-page">
  <div data-site-header></div>
  <main class="teams-content">
    <div class="container-xl">
      <a class="teams-back" href="Portal.html">← Voltar ao painel</a>
      <section class="teams-heading">
        <div>
          <p class="teams-kicker" id="teams-kicker">Obra 369</p>
          <h1>Equipes</h1>
          <p id="teams-intro">Vincule colaboradores a um encarregado e exporte as equipes para o Excel.</p>
        </div>
        <button class="teams-button" id="export-teams" type="button">Exportar equipes (Excel)</button>
      </section>
      <p class="teams-result" id="teams-export-result" role="status" hidden></p>
      <p class="teams-denied" id="teams-denied" role="alert" hidden>Esta tela é do DP, do administrador, do estagiário, do engenheiro e do encarregado.</p>

      <div id="teams-app">
        <section class="teams-card" id="foremen-card" aria-labelledby="foremen-title">
          <span class="teams-eyebrow">Passo 1</span>
          <h2 id="foremen-title">Encarregados</h2>
          <p class="teams-note" id="foremen-note"></p>
          <p class="teams-result" id="intern-result" role="status" hidden></p>
          <div class="foreman-grid" id="foreman-grid"></div>
        </section>

        <section class="teams-card" id="manage-card" aria-labelledby="manage-title">
          <span class="teams-eyebrow">Passo 2</span>
          <h2 id="manage-title">Colaboradores</h2>
          <p class="teams-note" id="manage-help"></p>
          <div class="teams-summary" id="team-summary"></div>
          <div id="manage-body">
            <div class="teams-toolbar" id="teams-toolbar">
              <input id="team-search" type="search" placeholder="Pesquisar nome, matrícula ou função..." aria-label="Pesquisar colaboradores" autocomplete="off">
              <select id="team-filter" aria-label="Filtrar colaboradores">
                <option value="all">Todos os colaboradores</option>
                <option value="team">Só da equipe</option>
                <option value="free">Sem equipe</option>
                <option value="others">De outras equipes</option>
              </select>
            </div>
            <div class="teams-bulk" id="teams-bulk">
              <button class="teams-button" id="bulk-add" type="button">Vincular selecionados à equipe</button>
              <button class="teams-button teams-button-light" id="bulk-remove" type="button">Tirar selecionados da equipe</button>
              <span id="selected-count" class="teams-note"></span>
            </div>
            <p class="teams-result" id="manage-result" role="status" hidden></p>
            <div class="teams-list" id="teams-list"></div>
          </div>
        </section>
      </div>
    </div>
  </main>
  <div data-site-footer></div>

  <script src="dom-utils.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>
  <script src="firebase-schema.js"></script>
  <script src="firebase-auth.js?v=20261001-gestor"></script>
  <script src="shared-components.js?v=20261002a"></script>
  <script src="firebase-employee-store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="Equipes.js?v=20260929-analista"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
