<body class="import-page" data-dash-shell="cadastrar">
  <div data-site-header></div>
  <main class="import-content">
    <div class="container-xl">
      <a class="import-back" href="Importar-Colaboradores.html">← Voltar para colaboradores</a>
      <section class="import-heading">
        <div>
          <p class="import-kicker">Administrador Analista · Obra 369</p>
          <h1>Cadastrar colaborador</h1>
          <p>Use esta opção para inclusões emergenciais enquanto a importação do RM não estiver disponível.</p>
        </div>
        <span class="import-security">Área restrita ao perfil fixo</span>
      </section>
      <form class="import-card manual-employee-form" id="employee-form">
        <label for="employee-registration">Matrícula</label>
        <input id="employee-registration" type="text" inputmode="numeric" pattern="[0-9]{7}" minlength="7" maxlength="7" required>
        <label for="employee-name">Nome completo</label>
        <input id="employee-name" type="text" required>
        <label for="employee-role">Função</label>
        <input id="employee-role" type="text" placeholder="Ex.: Servente, Eletricista, Armador" required>
        <label for="employee-team">Setor ou frente de trabalho</label>
        <input id="employee-team" type="text" placeholder="Ex.: Elétrica, Hidráulica, Forma" required>
        <label for="employee-foreman">Encarregado responsável</label>
        <select id="employee-foreman">
          <option value="">Sem encarregado</option>
        </select>
        <button class="import-submit" type="submit">Salvar colaborador</button>
        <p class="import-result" id="employee-result" role="status" hidden></p>
      </form>
    </div>
  </main>
  <div data-site-footer></div>
