<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cadastro manual de colaboradores pelo Administrador Analista.">
  <title>Cadastrar colaborador | Obra 369</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/site-overrides.css?v=fc8c3903">
  <link rel="stylesheet" href="css/pages/importar-colaboradores.css?v=8ac872a1">
  <link rel="icon" type="image/svg+xml" href="images/issel-informatica-simbolo.svg">
</head>
<body class="import-page">
  <div data-site-header></div>
  <main class="import-content">
    <div class="container-xl">
      <a class="import-back" href="Importar-Colaboradores.html">← Voltar para colaboradores</a>
      <section class="import-heading">
        <div>
          <p class="import-kicker">Administrador Analista · Obra 369</p>
          <h1>Cadastrar colaborador</h1>
          <p>Use esta opção para inclusões emergenciais enquanto a importação do RM não estiver disponível.</p>
        </div>
        <span class="import-security">Área restrita ao perfil fixo</span>
      </section>
      <form class="import-card manual-employee-form" id="employee-form">
        <label for="employee-registration">Matrícula</label>
        <input id="employee-registration" type="text" inputmode="numeric" pattern="[0-9]{7}" minlength="7" maxlength="7" required>
        <label for="employee-name">Nome completo</label>
        <input id="employee-name" type="text" required>
        <label for="employee-role">Função</label>
        <input id="employee-role" type="text" placeholder="Ex.: Servente, Eletricista, Armador" required>
        <label for="employee-team">Setor ou frente de trabalho</label>
        <input id="employee-team" type="text" placeholder="Ex.: Elétrica, Hidráulica, Forma" required>
        <label for="employee-foreman">Encarregado responsável</label>
        <select id="employee-foreman">
          <option value="">Sem encarregado</option>
        </select>
        <button class="import-submit" type="submit">Salvar colaborador</button>
        <p class="import-result" id="employee-result" role="status" hidden></p>
      </form>
    </div>
  </main>
  <div data-site-footer></div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/core/firebase-config.js?v=5f86e13f"></script>
  <script src="js/core/firebase-init.js?v=351c556d"></script>
  <script src="js/core/firebase-schema.js?v=c6f95036"></script>
<script src="js/core/firebase-auth.js?v=2908c044"></script>
  <script src="js/core/firebase-employee-store.js?v=f775198d"></script>
  <script src="js/core/dom-utils.js?v=d56b53a2"></script>
  <script src="js/core/shared-components.js?v=0aa1c7e3"></script>
  <script src="js/pages/cadastrar-colaborador.js?v=c6000371"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
